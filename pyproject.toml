[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-researcher"
version = "0.1.0"
description = "AI researcher webhook service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
